[env:eload_g030]
platform = ststm32
board = genericSTM32G030F6P
framework = arduino
upload_protocol = stlink
debug_tool = stlink
board_build.f_cpu = 64000000L
lib_deps = olikraus/U8g2@^2.36.5
lib_ignore = Wire, SPI
build_flags =
    -Os
    -DHAL_IWDG_MODULE_ENABLED
    -DHAL_I2C_MODULE_DISABLED
    -DHAL_UART_MODULE_DISABLED
    -DHAL_USART_MODULE_DISABLED
    -DHAL_SPI_MODULE_DISABLED
    -DHAL_I2S_MODULE_DISABLED
    -DHAL_SMBUS_MODULE_DISABLED
    -DHAL_IRDA_MODULE_DISABLED
    -DHAL_SMARTCARD_MODULE_DISABLED
    -DHAL_TIM_MODULE_DISABLED
    -DHAL_RTC_MODULE_DISABLED
    -DHAL_WWDG_MODULE_DISABLED
    -DHAL_DMA_MODULE_DISABLED
    -DU8X8_NO_HW_SPI
    -DU8X8_NO_HW_I2C
    -Wl,-Map=firmware.map



